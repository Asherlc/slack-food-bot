services:
  - type: web
    name: slack-food-bot-web
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 26.7.0
      - key: PNPM_VERSION
        value: 11.17.0
      - key: REDIS_URL
        fromService:
          type: redis
          name: slack-food-bot-redis
          property: connectionString
  - type: worker
    name: slack-food-bot-worker
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start:worker
    envVars:
      - key: NODE_VERSION
        value: 26.7.0
      - key: PNPM_VERSION
        value: 11.17.0
      - key: REDIS_URL
        fromService:
          type: redis
          name: slack-food-bot-redis
          property: connectionString
  - type: redis
    name: slack-food-bot-redis
    plan: free
    ipAllowList: []
